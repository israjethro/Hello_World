<style>
  /* =====================================================================
     QA - Daily Status Dashboard - Stylesheet
     Theme: teal & pink on a dark glassmorphism surface.
     All declarations live inside this single <style> block so the
     Apps Script include() scriptlet pastes one cohesive chunk into
     the rendered Index.html.
     ===================================================================== */

  :root {
    --teal:        #0fb5a8;
    --teal-dark:   #0a857c;
    --pink:        #ffd6e0;
    --pink-strong: #ff6b9a;
    --amber:       #ffb648;

    --bg-0: #0f1720;
    --bg-1: #131c27;

    --surface:        rgba(255,255,255,0.06);
    --surface-strong: rgba(255,255,255,0.10);
    --border:         rgba(255,255,255,0.10);
    --border-strong:  rgba(255,255,255,0.18);

    --text:  #eaf2f4;
    --muted: #9fb1bd;

    --shadow:    0 12px 40px rgba(0,0,0,0.35);
    --shadow-sm: 0 6px 18px rgba(0,0,0,0.30);

    --radius-lg: 22px;
    --radius-md: 18px;
    --radius-sm: 12px;

    --t-fast: 160ms;
    --t-mid:  220ms;

    --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(15,181,168,0.20), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(255,107,154,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    background-attachment: fixed;
    overflow-x: hidden;
  }
  body::before {
    /* slow drifting gradient overlay - very low opacity so it stays subtle */
    content: '';
    position: fixed; inset: -20%;
    background:
      radial-gradient(600px 400px at 30% 20%, rgba(15,181,168,0.10), transparent 70%),
      radial-gradient(700px 500px at 80% 80%, rgba(255,107,154,0.10), transparent 70%);
    animation: drift 22s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) rotate(0deg);   }
    100% { transform: translate3d(2%,1%,0) rotate(0.6deg);}
  }

  #app { position: relative; z-index: 1; }
  main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 28px 40px;
    display: grid;
    gap: 28px;
  }

  h1, h2, h3 { font-family: var(--font); margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 700; }

  a { color: var(--teal); }

  :focus-visible {
    outline: 2px solid var(--pink-strong);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------------------------------------------------------------------
     Banner / Hero
     --------------------------------------------------------------------- */
  .banner {
    position: relative;
    overflow: hidden;
    padding: 48px 32px 40px;
    margin: 0 0 8px;
    border-radius: 0 0 28px 28px;
    background:
      linear-gradient(135deg, rgba(15,181,168,0.18), rgba(255,107,154,0.14)),
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .banner__bg {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .banner__bg .blob {
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob--teal {
    background: radial-gradient(circle, var(--teal) 0%, transparent 70%);
    top: -120px; left: -80px;
  }
  .blob--pink {
    background: radial-gradient(circle, var(--pink-strong) 0%, transparent 70%);
    top: -60px; right: -120px;
    animation-delay: -6s;
  }
  @keyframes float {
    0%   { transform: translate3d(0,0,0)   scale(1);    }
    100% { transform: translate3d(20px,30px,0) scale(1.06); }
  }

  .banner__inner {
    position: relative;
    max-width: 1320px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
    align-items: center;
  }
  .banner__copy { min-width: 0; }
  .banner__eyebrow {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--pink);
    text-transform: uppercase;
  }
  .banner__title {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, var(--pink) 60%, var(--teal) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 8px;
  }
  .banner__tagline {
    margin: 0 0 20px;
    color: var(--muted);
    max-width: 56ch;
  }

  .banner__art {
    position: relative;
    width: 100%;
    max-width: 480px;
    justify-self: end;
  }
  .banner__art svg { width: 100%; height: auto; display: block; }

  /* ---------------------------------------------------------------------
     Member buttons
     --------------------------------------------------------------------- */
  .member-buttons {
    display: block;
    margin-top: 8px;
  }
  #memberButtons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .member-buttons button {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition:
      transform var(--t-mid) ease,
      box-shadow var(--t-mid) ease,
      border-color var(--t-mid) ease,
      background-color var(--t-mid) ease;
  }
  .member-buttons button:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
    background: var(--surface-strong);
  }
  .member-buttons button.is-active {
    border-color: var(--pink-strong);
    background: linear-gradient(135deg, rgba(255,107,154,0.22), rgba(15,181,168,0.18));
    box-shadow:
      0 0 0 1px rgba(255,107,154,0.35) inset,
      0 8px 22px rgba(255,107,154,0.25);
  }
  .member-buttons button .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    background: var(--teal);
  }
  .member-buttons button.is-active .dot { background: var(--pink-strong); }

  /* ---------------------------------------------------------------------
     Glassmorphism surface (shared)
     --------------------------------------------------------------------- */
  .glass {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
  }

  /* ---------------------------------------------------------------------
     Charts grid
     --------------------------------------------------------------------- */
  .charts {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 20px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 18px 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    animation: fadeUp 520ms cubic-bezier(.2,.7,.2,1) both;
  }
  .chart-card:nth-child(1) { animation-delay: 60ms;  }
  .chart-card:nth-child(2) { animation-delay: 140ms; }
  .chart-card:nth-child(3) { animation-delay: 220ms; }

  .chart-card__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
    padding: 0 4px;
  }
  .chart-card__sub { color: var(--muted); font-size: 12px; }
  .chart-canvas { width: 100%; height: 280px; }
  .chart-canvas--tall { height: 360px; }

  /* ---------------------------------------------------------------------
     KPI cards
     --------------------------------------------------------------------- */
  .cards__header,
  .table-section__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 0 4px;
    margin-bottom: 12px;
  }
  .cards__sub { color: var(--muted); font-size: 13px; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .kpi-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow-sm);
    transition:
      transform var(--t-mid) ease,
      box-shadow var(--t-mid) ease,
      border-color var(--t-mid) ease,
      background-color var(--t-mid) ease;
    animation: fadeUp 520ms cubic-bezier(.2,.7,.2,1) both;
  }
  .kpi-card:nth-child(1) { animation-delay: 80ms;  }
  .kpi-card:nth-child(2) { animation-delay: 140ms; }
  .kpi-card:nth-child(3) { animation-delay: 200ms; }
  .kpi-card:nth-child(4) { animation-delay: 260ms; }
  .kpi-card:nth-child(5) { animation-delay: 320ms; }
  .kpi-card:nth-child(6) { animation-delay: 380ms; }

  .kpi-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--border-strong);
    background: var(--surface-strong);
  }
  .kpi-card.is-selected {
    border-color: var(--pink-strong);
    box-shadow:
      0 0 0 1px rgba(255,107,154,0.35) inset,
      0 14px 36px rgba(255,107,154,0.22);
    background: linear-gradient(135deg, rgba(255,107,154,0.10), rgba(15,181,168,0.08));
  }

  .kpi-card__head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: #0f1720;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.02em;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    flex: 0 0 48px;
  }
  .kpi-card__name {
    font-weight: 700;
    font-size: 16px;
    margin: 0;
  }
  .kpi-card__role {
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 0;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px 12px;
  }
  .kpi {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .kpi__label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .kpi__value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .kpi--accent .kpi__value { color: var(--teal); }
  .kpi--warn   .kpi__value { color: var(--pink-strong); }
  .kpi--bug    .kpi__value { color: var(--amber); }

  /* ---------------------------------------------------------------------
     Table
     --------------------------------------------------------------------- */
  .table-section { /* container */ }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    overflow: auto;
    max-height: 560px;
  }
  table#taskTable {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13.5px;
    min-width: 880px;
  }
  table#taskTable thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(15,23,32,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  table#taskTable thead th .sort-ind {
    display: inline-block;
    margin-left: 6px;
    opacity: 0.5;
    font-size: 10px;
  }
  table#taskTable thead th.is-sorted { color: var(--text); }
  table#taskTable thead th.is-sorted .sort-ind { opacity: 1; color: var(--pink-strong); }

  table#taskTable tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
    color: var(--text);
  }
  table#taskTable tbody tr:nth-child(even) td {
    background: rgba(255,255,255,0.025);
  }
  table#taskTable tbody tr:hover td {
    background: rgba(15,181,168,0.06);
  }
  table#taskTable tbody tr.is-empty td {
    color: var(--muted);
    text-align: center;
    padding: 28px 14px;
  }

  /* status pills */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .pill.completed {
    background: rgba(15,181,168,0.18);
    color: #b9f6ee;
    border-color: rgba(15,181,168,0.45);
  }
  .pill.in-progress {
    background: rgba(255,107,154,0.18);
    color: #ffd0e0;
    border-color: rgba(255,107,154,0.45);
  }
  .pill.bug {
    background: rgba(255,182,72,0.16);
    color: #ffe0b3;
    border-color: rgba(255,182,72,0.45);
  }
  .bug-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px; height: 22px;
    padding: 0 7px;
    border-radius: 999px;
    background: rgba(255,182,72,0.18);
    border: 1px solid rgba(255,182,72,0.45);
    color: var(--amber);
    font-size: 11.5px;
    font-weight: 700;
  }
  .billable-yes { color: #b9f6ee; font-weight: 600; }
  .billable-no  { color: var(--muted); }

  /* search input */
  .search {
    position: relative;
    display: inline-flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px 6px 36px;
    transition: border-color var(--t-fast) ease, background-color var(--t-fast) ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .search:focus-within {
    border-color: var(--pink-strong);
    background: var(--surface-strong);
  }
  .search__icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    display: inline-flex;
  }
  .search input {
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    width: 260px;
    padding: 4px 0;
  }
  .search input::placeholder { color: var(--muted); }

  /* ---------------------------------------------------------------------
     Footer
     --------------------------------------------------------------------- */
  .footer {
    max-width: 1320px;
    margin: 8px auto 0;
    padding: 18px 28px 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12.5px;
    flex-wrap: wrap;
  }
  .footer__sep { opacity: 0.6; }
  .footer__updated { font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------------
     Inline notification banner (mock-data fallback)
     --------------------------------------------------------------------- */
  .notice {
    max-width: 1320px;
    margin: 12px auto 0;
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(255,182,72,0.12);
    border: 1px solid rgba(255,182,72,0.4);
    color: #ffe0b3;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .notice__dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 4px rgba(255,182,72,0.18);
  }

  /* ---------------------------------------------------------------------
     Animations
     --------------------------------------------------------------------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0);   }
  }

  /* ---------------------------------------------------------------------
     Responsive
     --------------------------------------------------------------------- */
  @media (max-width: 900px) {
    .charts { grid-template-columns: 1fr; }
    .chart-canvas--tall { height: 320px; }
    .banner__inner { grid-template-columns: 1fr; }
    .banner__art { max-width: 320px; justify-self: center; }
  }
  @media (max-width: 720px) {
    main { padding: 16px 16px 32px; gap: 22px; }
    .banner { padding: 36px 20px 28px; border-radius: 0 0 22px 22px; }
    .banner__title { font-size: 32px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .search input { width: 160px; }
    .table-section__header { flex-direction: column; align-items: flex-start; }
    .table-wrap { max-height: none; }
    table#taskTable { min-width: 720px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    body::before { animation: none; }
  }
</style>
