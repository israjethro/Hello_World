<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <title>QA - Daily Status Dashboard</title>

  <!--
    Google Font + ECharts loaded from CDNs at *runtime* in the user's
    browser. They are not fetched at build time; INTEGRATIONS_ONLY
    sandboxes never need to reach these hosts during scaffolding.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ECharts 5 (core) for the doughnut + line + 2D bar fallback. -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <!-- ECharts-GL 2 plugin for the 3D bar chart. Optional - the JS
       gracefully falls back to a 2D bar with shadow if it fails. -->
  <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2/dist/echarts-gl.min.js"></script>

  <?!= include('Stylesheet') ?>
</head>
<body>
  <div id="app">

    <?!= include('Banner') ?>

    <main>

      <section id="charts" class="charts" aria-label="Charts">
        <div class="chart-card chart-card--wide" aria-label="Hours per member 3D">
          <div class="chart-card__header">
            <h2>Hours per member</h2>
            <span class="chart-card__sub">3D bar - team load distribution</span>
          </div>
          <div id="chart3d" class="chart-canvas chart-canvas--tall" role="img" aria-label="3D bar chart of hours per member"></div>
        </div>
        <div class="chart-card" aria-label="Status breakdown">
          <div class="chart-card__header">
            <h2>Status breakdown</h2>
            <span class="chart-card__sub">Completed vs In-Progress</span>
          </div>
          <div id="chartStatus" class="chart-canvas" role="img" aria-label="Doughnut chart of task statuses"></div>
        </div>
        <div class="chart-card" aria-label="Hours per day trend">
          <div class="chart-card__header">
            <h2>Hours per day</h2>
            <span class="chart-card__sub">Trend for the current selection</span>
          </div>
          <div id="chartTrend" class="chart-canvas" role="img" aria-label="Smooth line chart of hours per day"></div>
        </div>
      </section>

      <section id="cards" class="cards" aria-label="Per-member KPI cards">
        <div class="cards__header">
          <h2>Resource KPIs</h2>
          <span class="cards__sub">Click any card to filter charts and table</span>
        </div>
        <div id="cardsGrid" class="cards-grid"></div>
      </section>

      <section id="table" class="table-section" aria-label="Daily task table">
        <div class="table-section__header">
          <h2>Daily tasks</h2>
          <label class="search">
            <span class="search__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            </span>
            <input id="tableSearch" type="search" placeholder="Search tasks, clients, projects..." aria-label="Search tasks">
          </label>
        </div>
        <div class="table-wrap">
          <table id="taskTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="footer" aria-label="Page footer">
      <span>QA - Daily Status Dashboard</span>
      <span class="footer__sep" aria-hidden="true">-</span>
      <span class="footer__updated">Last updated: <span id="updatedAt">-</span></span>
    </footer>

  </div>

  <?!= include('Javascript') ?>
</body>
</html>
